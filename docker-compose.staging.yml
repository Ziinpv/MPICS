# Staging stack — dùng kèm .env.staging (không commit secret)
# docker compose -f docker-compose.staging.yml --env-file apps/web/.env.staging up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: mpcis-stg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mpcis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mpcis}
    volumes:
      - mpcis_stg_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mpcis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: mpcis-stg-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes:
      - mpcis_stg_minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mpcis-stg-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./infra/mosquitto/mosquitto-tls.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./infra/mosquitto/acl:/mosquitto/config/acl:ro
      - ./infra/mosquitto/certs:/mosquitto/certs:ro

  mailpit:
    image: axllent/mailpit:v1.22.3
    container_name: mpcis-stg-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: mpcis-stg-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    env_file:
      - ./apps/web/.env.staging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mpcis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mpcis}?schema=public
      S3_ENDPOINT: http://minio:9000
      TTS_PYTHON: python3
      TTS_FALLBACK_MOCK: ${TTS_FALLBACK_MOCK:-1}
    ports:
      - "3000:3000"

  caddy:
    image: caddy:2.8-alpine
    container_name: mpcis-stg-caddy
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - mpcis_stg_caddy:/data
      - mpcis_stg_caddy_config:/config

volumes:
  mpcis_stg_pg:
  mpcis_stg_minio:
  mpcis_stg_caddy:
  mpcis_stg_caddy_config:
